<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Character Counter \^o^/</h1>
    <p>Type and track your characters</p>
    <div class="container">
        <h3>Start typing below.......</h3>
        <textarea name="" id="typingArea" placeholder="Start typing here..." maxlength="200"></textarea>
        <div class="counter">
            <div class="content">
            <div class="number"><span id="count">0</span>/200</div>
            <p>characters</p>
            </div>
        </div>
    </div>

    <div class="note">
        <p>Type up to 200 characters.</p>
        <p>The count updates in real-time as you type.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
