<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute CSS Turtle</title>
    <link rel="stylesheet" href="turtle.css">
</head>

<body>
    <div class="turtle">
        <div class="head border light-green">
            <div class="eyes">
                <div class="eye">
                    <div class="eyelight"></div>
                </div>
                <div class="eye">
                    <div class="eyelight"></div>
                </div>
            </div>
        </div>
        <div class="hands">
            <div class="hand hand1 border light-green"></div>
            <div class="hand hand2 border light-green"></div>
        </div>
        <div class="body border">
            <div class="body-inside border">
            <div class="bodycircle1 border"></div>
            <div class="bodycircle2 border"></div>
            <div class="bodycircle3 border"></div>
            <div class="bodycircle4 border"></div>
            </div>
        </div>
        <div class="legs">
            <div class="leg leg1 border light-green"></div>
            <div class="tail border light-green"></div>
            <div class="leg leg2 border light-green"></div>
        </div>
    </div>
</body>

</html>
