<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg on a Pan CSS</title>
    <link rel="stylesheet" href="egg.css">
</head>

<body>
    <div class="container">
        <div class="pan">
            <div class="pan-area">
                <div class="egg">
                    <div class="egg-yolk">
                        <div class="eyes">
                            <div class="eye eye1">
                                <div class="eyelight"></div>
                            </div>
                            <div class="eye eye2">
                                <div class="eyelight"></div>
                            </div>
                        </div>
                        <div class="blushes">
                            <div class="blush blush1"></div>
                            <div class="blush blush2"></div>
                        </div>
                        <div class="smile"></div>
                    </div>
                    <div class="white egg-white1"></div>
                    <div class="white egg-white2"></div>
                    <div class="white egg-white3"></div>
                    <div class="white egg-white4"></div>
                    <div class="white egg-white5"></div>
                    <div class="white egg-white6"></div>
                </div>
            </div>
        </div>
    
    <div class="pan-handle"></div>
    <div class="pan-grip"></div>
    </div>
</body>

</html>
