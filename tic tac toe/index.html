<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <ul>
            <li>MyTicTacToe.com</li>
        </ul>
    </nav>
    <div class="game">
        <div class="line"></div>
<div class="container">
        <div class="grid br-t br-l "><span class="boxtext"></span></div>
        <div class="grid br-t" ><span class="boxtext"></span></div>
        <div class="grid br-t br-r "><span class="boxtext"></span></div>
        <div class="grid br-l"><span class="boxtext"></span></div>
        <div class="grid "><span class="boxtext"></span></div>
        <div class="grid br-r"><span class="boxtext"></span></div>
        <div class="grid br-b br-l"><span class="boxtext"></span></div>
        <div class="grid br-b"><span class="boxtext"></span></div>
        <div class="grid br-b br-r"><span class="boxtext"></span></div>
</div>
<div class="gameinfo">
    <h1>Welcome to tick tack Toe</h1>
    <span class="info">Turn For X</span><br>
    <button id="reset">Reset</button>
    <div class="imgbox">
    <img src="excited.gif" alt="">
</div>
</div>

    </div>
    <script src="script.js"></script>
</body>

</html>
