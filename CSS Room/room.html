<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Room</title>
    <link rel="stylesheet" href="room.css">
</head>
<body>
    <!-- Making a Roomm design using HTML and CSS -->
     <div class="room">
        <div class="wall">
            <div class="bookshelf">
                <div class="shelf shelf1">
                    <div class="book1"></div>
                    <div class="book2"></div>
                    <div class="book3"></div>
                    <div class="book4"></div>
                </div>
                <div class="shelf shelf2">
                    <div class="book5"></div>
                    <div class="book6"></div>
                    <div class="book7"></div>
                    <div class="book8"></div>
                    <div class="book9"></div>
                </div>
                <div class="shelf shelf3">
                    <div class="book10"></div>
                    <div class="book11"></div>
                    <div class="book12"></div>
                    <div class="bookstack">
                        <div class="stackbook1"></div>
                        <div class="stackbook2"></div>
                    </div>
                </div>
                <div class="shelf shelf4">
                    <div class="shelf-block"></div>
                </div>
            </div>

            <div class="photoframe"></div>


            <div class="desk">
                <div class="desk-space"></div>
                <div class="desk-leg leg1"></div>
                <div class="desk-leg leg2"></div>
            </div>
        </div>

        <div class="floor">
            <div class="rug"></div>

            <div class="plant">
            <div class="stem">
            <div class="leaf1 leaf"></div>
            <div class="leaf2 leaf"></div>
            <div class="leaf3 leaf"></div>
            <div class="leaf4 leaf"></div>
            <div class="leaf5 leaf"></div>
            <div class="leaf6 leaf"></div>
            </div>
            <div class="pot"></div>
        </div>

        </div>
     </div>
</body>
</html>
