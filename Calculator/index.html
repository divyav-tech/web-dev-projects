<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" id="output" disabled placeholder="0">
        <div class="buttons">
            <button id="clear" class="action-btn">C</button>
            <button id="delete"><i class="fa-solid fa-delete-left"></i></button>
            <button class="input operation">%</button>
            <button class="input operation">/</button>
            <button class="input">7</button>
            <button class="input">8</button>
            <button class="input">9</button>
            <button class="input operation">*</button>
            <button class="input">4</button>
            <button class="input">5</button>
            <button class="input">6</button>
            <button class="input operation">-</button>
            <button class="input">1</button>
            <button class="input">2</button>
            <button class="input">3</button>
            <button class="input operation">+</button>
            <button class="input">0</button>
            <button class="input">.</button>
            <button id="evaluate" class="action-btn">=</button>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/78652ec636.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
